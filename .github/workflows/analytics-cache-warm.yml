name: Warm Analytics Cache

on:
  schedule:
    # Every 2 hours during market hours 06:00-20:00 UK (05:00-19:00 UTC) -- keeps the
    # cache at most 2 hours stale rather than riding out the full day on the 15-minute TTL.
    - cron: '0 5,7,9,11,13,15,17,19 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/analytics/warm-cache
        run: |
          curl --fail --silent --show-error \
            -H "x-warm-cache-secret: ${{ secrets.ANALYTICS_WARM_CACHE_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/analytics/warm-cache"

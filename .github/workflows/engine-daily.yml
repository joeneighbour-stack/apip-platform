# ============================================================================
# APIP Intelligence Engine -- Daily Scheduled Runs
# ============================================================================
# Low-frequency engine/weekly jobs only. The high-frequency jobs that used to live here
# (shadow-lifecycle every 5 minutes, import-actual-trades every 15) are split into their
# own workflow files (shadow-monitor.yml, import-trades.yml) -- every cron trigger fires
# the ENTIRE workflow it's declared in, not just the one job it's meant for, so those two
# firing dozens of times a day was queuing runs ahead of the engine jobs below that need
# to run at a precise time (e.g. engine-european at 04:50 UTC actually starting on time).
name: APIP Engine

on:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '35 4 * * 1-5'
    - cron: '45 4 * * 1-5'
    - cron: '50 4 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '50 8 * * 1-5'
    - cron: '25 12 * * 1-4'
    - cron: '30 12 * * 1-4'
    - cron: '0 5 * * 1'
    - cron: '15 5 * * 1'
    - cron: '30 5 * * 1'
    - cron: '45 5 * * 1'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        type: choice
        options:
          - populate-daily
          - derive-regime
          - snapshot-european
          - engine-european
          - snapshot-us
          - engine-us
          - snapshot-apac
          - engine-apac
          - generate-profiles
          - generate-atr-profiles
          - calculate-kpis
          - calculate-shadow-kpis
          - condition-awareness
          - generate-post-trade-reviews

jobs:
  populate-daily:
    name: Populate Market State Daily
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'populate-daily' ||
      github.event_name == 'schedule' && github.event.schedule == '30 4 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/populateMarketStateDaily.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  derive-regime:
    name: Derive Market Regime
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'derive-regime' ||
      github.event_name == 'schedule' && github.event.schedule == '35 4 * * 1-5' ||
      github.event_name == 'schedule' && github.event.schedule == '15 5 * * 1'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  snapshot-european:
    name: Intraday Snapshot -- European
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-european' ||
      github.event_name == 'schedule' && github.event.schedule == '45 4 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=EUROPEAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-european:
    name: Engine Session -- European
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-european' ||
      github.event_name == 'schedule' && github.event.schedule == '50 4 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # Guarantees fresh regime data for this session regardless of the standalone
      # derive-regime job's own schedule/timing -- GitHub Actions' `needs:` cannot
      # bridge separately cron-triggered jobs in this workflow (each job only runs
      # in the single triggering event that matches its own `if:` condition), so
      # ordering must be enforced within this job, not across jobs.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=EUROPEAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  snapshot-us:
    name: Intraday Snapshot -- US
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-us' ||
      github.event_name == 'schedule' && github.event.schedule == '45 8 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=US
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-us:
    name: Engine Session -- US
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-us' ||
      github.event_name == 'schedule' && github.event.schedule == '50 8 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # See engine-european's identical step -- needs: can't bridge separately
      # cron-triggered jobs, so regime freshness is enforced within this job.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=US
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  snapshot-apac:
    name: Intraday Snapshot -- APAC
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-apac' ||
      github.event_name == 'schedule' && github.event.schedule == '25 12 * * 1-4'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=APAC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-apac:
    name: Engine Session -- APAC
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-apac' ||
      github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1-4'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # Belt-and-suspenders guard for manual workflow_dispatch triggers on a Friday --
      # the schedule itself is already Mon-Thu only (1-4), so this only ever bites a
      # manual run. A bare `exit 0` inside a run: step only ends that step
      # successfully, it doesn't skip the rest of the job -- so the check is exposed
      # as a step output and the two real-work steps below are gated on it instead.
      - name: Skip if Friday
        id: friday-check
        run: |
          if [ "$(date +%u)" = "5" ]; then
            echo "Friday — APAC engine skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # See engine-european's identical step -- needs: can't bridge separately
      # cron-triggered jobs, so regime freshness is enforced within this job.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        if: steps.friday-check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=APAC
        if: steps.friday-check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  generate-profiles:
    name: Generate Analyst Profiles
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-profiles' ||
      github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/generateAnalystProfiles.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  generate-atr-profiles:
    name: Generate Analyst ATR Profiles
    runs-on: ubuntu-latest
    # Must run after generate-profiles (0 5 * * 1) -- ATR profiles are derived from
    # analyst profiles, so reading them before generate-profiles has written this
    # week's data would produce stale results. GitHub Actions' `needs:` can't bridge
    # jobs triggered by separate cron schedules (same limitation documented on
    # engine-european/engine-us/engine-apac above), so there's no way to make that
    # dependency explicit -- the 45-minute gap between 0 5 * * 1 and 45 5 * * 1 is the
    # buffer this relies on instead. generate-profiles has consistently finished well
    # within that window; if it's ever changed to do meaningfully more work, re-check
    # this gap is still enough.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-atr-profiles' ||
      github.event_name == 'schedule' && github.event.schedule == '45 5 * * 1'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - name: Generate analyst ATR profiles
        run: npx tsx src/scripts/generateAtrProfiles.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  calculate-kpis:
    name: Calculate Analyst KPIs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'calculate-kpis' ||
      github.event_name == 'schedule' && github.event.schedule == '30 5 * * 1'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/calculateKpis.ts --months=36
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  calculate-shadow-kpis:
    name: Calculate Shadow System KPIs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'calculate-shadow-kpis' ||
      github.event_name == 'schedule' && github.event.schedule == '30 5 * * 1'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/calculateShadowKpis.ts --months=36
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  condition-awareness:
    name: Condition Awareness Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'condition-awareness'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/runConditionAwareness.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

  generate-post-trade-reviews:
    name: Generate Post-Trade Reviews
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-post-trade-reviews' ||
      github.event_name == 'schedule' && github.event.schedule == '30 22 * * 1-5'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/generatePostTradeReviews.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}



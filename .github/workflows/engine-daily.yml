# ============================================================================
# APIP Intelligence Engine -- Daily Scheduled Runs
# ============================================================================
# Low-frequency engine/weekly jobs only. The high-frequency jobs that used to live here
# (shadow-lifecycle every 5 minutes, import-actual-trades every 15) are split into their
# own workflow files (shadow-monitor.yml, import-trades.yml) -- every cron trigger fires
# the ENTIRE workflow it's declared in, not just the one job it's meant for, so those two
# firing dozens of times a day was queuing runs ahead of the engine jobs below that need
# to run at a precise time (e.g. engine-european at 04:50 UTC actually starting on time).
#
# NOTE: ALL job schedules (daily and weekly) are triggered by the Railway
# engine-trigger service via workflow_dispatch. There are no GitHub Actions
# cron schedules in this file — Railway is the authoritative scheduler.
# See engine-trigger/index.js for the complete schedule.
name: APIP Engine

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        type: choice
        options:
          - preallocate-day
          - populate-daily
          - derive-regime
          - snapshot-european
          - engine-european
          - snapshot-us
          - engine-us
          - snapshot-apac
          - engine-apac
          - generate-profiles
          - generate-atr-profiles
          - calculate-kpis
          - calculate-shadow-kpis
          - condition-awareness
          - generate-post-trade-reviews

jobs:
  preallocate-day:
    name: Day-Start Coverage Preallocation
    runs-on: ubuntu-latest
    # Runs before every other job today (04:20 UTC, per engine-trigger/index.js) --
    # no dependency on populate-daily or derive-regime, deliberately: it scores off
    # whatever market_regime_state already holds (yesterday's reading) rather than
    # waiting for today's, since the whole point is a plan available before the
    # day's real data exists. See preallocateDay.ts's own header comment.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'preallocate-day'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/preallocateDay.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  populate-daily:
    name: Populate Market State Daily
    runs-on: ubuntu-latest
    # Railway triggers this job twice a day via workflow_dispatch (see
    # engine-trigger/index.js) -- once early and again after the US session
    # closes, so market_state_daily has that day's complete bar (close/ATR
    # etc.) rather than only the early run's partial/prior-day data -- the
    # next morning's European session (and anything else reading
    # market_state_daily) then sees a finished bar.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'populate-daily'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/populateMarketStateDaily.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  derive-regime:
    name: Derive Market Regime
    runs-on: ubuntu-latest
    # Mirrors populate-daily's evening run above (both triggered by Railway --
    # see engine-trigger/index.js) -- regime derived from that run's now-complete
    # daily bar, not the partial one from the earlier run.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'derive-regime'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  snapshot-european:
    name: Intraday Snapshot -- European
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-european'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=EUROPEAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-european:
    name: Engine Session -- European
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-european'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # Guarantees fresh regime data for this session regardless of the standalone
      # derive-regime job's own timing -- GitHub Actions' `needs:` cannot bridge
      # jobs triggered by separate workflow_dispatch calls from Railway (each job
      # only runs in the single triggering event that matches its own `if:`
      # condition), so ordering must be enforced within this job, not across jobs.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=EUROPEAN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  snapshot-us:
    name: Intraday Snapshot -- US
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-us'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=US
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-us:
    name: Engine Session -- US
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-us'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # See engine-european's identical step -- needs: can't bridge separately
      # workflow_dispatch-triggered jobs, so regime freshness is enforced within this job.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=US
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  snapshot-apac:
    name: Intraday Snapshot -- APAC
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'snapshot-apac'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/captureIntradaySnapshot.ts --session=APAC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  engine-apac:
    name: Engine Session -- APAC
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'engine-apac'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      # Guard against a Friday run -- Railway's own cron (engine-trigger/index.js)
      # already restricts engine-apac to Mon-Thu, but a manual workflow_dispatch
      # trigger has no day-of-week restriction at all, so this is the only thing
      # stopping one on a Friday. A bare `exit 0` inside a run: step only ends
      # that step successfully, it doesn't skip the rest of the job -- so the
      # check is exposed as a step output and the two real-work steps below are
      # gated on it instead.
      - name: Skip if Friday
        id: friday-check
        run: |
          if [ "$(date +%u)" = "5" ]; then
            echo "Friday — APAC engine skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # See engine-european's identical step -- needs: can't bridge separately
      # workflow_dispatch-triggered jobs, so regime freshness is enforced within this job.
      - run: npx tsx src/scripts/deriveMarketRegime.ts
        if: steps.friday-check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npx tsx src/scripts/runEngineSession.ts --session=APAC
        if: steps.friday-check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}

  generate-profiles:
    name: Generate Analyst Profiles
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-profiles'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/generateAnalystProfiles.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  generate-atr-profiles:
    name: Generate Analyst ATR Profiles
    runs-on: ubuntu-latest
    # Must run after generate-profiles -- ATR profiles are derived from
    # analyst profiles, so reading them before generate-profiles has written this
    # week's data would produce stale results. GitHub Actions' `needs:` can't bridge
    # jobs triggered by separate workflow_dispatch calls from Railway (same
    # limitation documented on engine-european/engine-us/engine-apac above), so
    # there's no way to make that dependency explicit -- the 45-minute gap between
    # generate-profiles (Monday 04:58 UTC) and generate-atr-profiles (Monday 05:43
    # UTC) in engine-trigger/index.js is the buffer this relies on instead.
    # generate-profiles has consistently finished well within that window; if it's
    # ever changed to do meaningfully more work, re-check this gap is still enough.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-atr-profiles'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - name: Generate analyst ATR profiles
        run: npx tsx src/scripts/generateAtrProfiles.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  calculate-kpis:
    name: Calculate Analyst KPIs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'calculate-kpis'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/calculateKpis.ts --months=36
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  calculate-shadow-kpis:
    name: Calculate Shadow System KPIs
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'calculate-shadow-kpis'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/calculateShadowKpis.ts --months=36
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  condition-awareness:
    name: Condition Awareness Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'condition-awareness'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/runConditionAwareness.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

  generate-post-trade-reviews:
    name: Generate Post-Trade Reviews
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-post-trade-reviews'
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/generatePostTradeReviews.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}



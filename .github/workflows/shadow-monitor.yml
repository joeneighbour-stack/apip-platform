# ============================================================================
# Shadow Trade Monitor -- High-Frequency Schedule
# ============================================================================
# Split out of engine-daily.yml: this fires every 5 minutes during market hours, and
# every one of those firings used to trigger the ENTIRE engine-daily.yml workflow (every
# cron trigger fires the whole workflow, not just the one job it's meant for) -- queuing
# dozens of runs a day ahead of the low-frequency engine jobs that actually need to run
# at a precise time. Isolated here so it can't delay them.
#
# No longer has its own on.schedule -- moved to Railway's cron (engine-trigger/index.js)
# for more reliable timing than GitHub Actions' best-effort native schedule, which can
# be delayed or silently skipped under platform load. Only workflow_dispatch remains
# here; Railway is the trigger source now, same as engine-daily.yml.
name: Shadow Trade Monitor

on:
  workflow_dispatch:

jobs:
  shadow-lifecycle:
    name: Shadow Trade Monitor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: intelligence-engine/package-lock.json
      - run: npm ci
      - run: npx tsx src/scripts/monitorShadowTrades.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_CANDLE_API_KEY: ${{ secrets.FINNHUB_CANDLE_API_KEY }}
